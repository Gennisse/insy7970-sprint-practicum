[project]
name = "weeknight-recipe-scout"
version = "1.1.0"
description = "Recipe comparison and recommendations for busy weeknight cooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.8.0",
    "pytest>=8.0.0",
    "streamlit>=1.37.0",
]

[project.scripts]
weeknight-recipe-scout = "main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "history"]

[dependency-groups]
dev = ["ruff>=0.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
